<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pass It On — Firebase Sync Test</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a0d16;
    color: #f3f5fb;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #9aa3ba; font-size: 0.9rem; }
  #status {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 12px 0;
  }
  #status.connecting { background: rgba(246,168,33,0.15); color: #ffc266; }
  #status.connected { background: rgba(41,214,200,0.15); color: #6ef0e4; }
  #status.error { background: rgba(228,72,122,0.15); color: #ff9db6; }
  #counter {
    font-size: 5rem;
    font-weight: 800;
    margin: 24px 0;
  }
  button {
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ffc266, #ff9d3d);
    color: #201404;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log {
    margin-top: 30px;
    text-align: left;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: #9aa3ba;
    max-height: 160px;
    overflow-y: auto;
  }
  #log div { padding: 2px 0; }
</style>
</head>
<body>

<h1>Firebase Sync Test</h1>
<p class="sub">
  Open this same page on two devices (or two browser tabs). Tap the
  button on either one — the count should update on <em>both</em>
  within a second or two. That's the whole test: if it works here,
  the realtime plumbing works for the real game too.
</p>

<div id="status" class="connecting">Connecting…</div>
<div id="counter">–</div>
<button id="bump-btn" disabled>Tap to increment</button>

<div id="log"></div>

<script src="js/firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, increment, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const statusEl = document.getElementById("status");
  const counterEl = document.getElementById("counter");
  const btn = document.getElementById("bump-btn");
  const logEl = document.getElementById("log");

  function log(msg) {
    const line = document.createElement("div");
    line.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
    logEl.prepend(line);
  }

  function setStatus(state, text) {
    statusEl.className = state;
    statusEl.textContent = text;
  }

  const ROOM_ID = "sync-test-room";
  let connected = false;

  if (!window.firebaseConfig || window.firebaseConfig.apiKey.startsWith("PASTE-")) {
    setStatus("error", "Missing config");
    log("js/firebase-config.js still has placeholder values — paste your real Firebase config in there first.");
  } else {
    log("Initializing Firebase app…");
    try {
      const app = initializeApp(window.firebaseConfig);
      log("Connecting to Firestore…");
      const db = getFirestore(app);
      const roomRef = doc(db, "games", ROOM_ID);

      // Attach the live listener FIRST rather than doing a one-time
      // read-then-write — onSnapshot handles "document doesn't exist
      // yet" as a normal (non-error) event, so nothing here blocks
      // waiting on a prior round trip before we're listening.
      onSnapshot(roomRef, async snap => {
        if (!snap.exists()) {
          log("Room document doesn't exist yet — creating it…");
          try {
            await setDoc(roomRef, { counter: 0, lastUpdated: serverTimestamp() });
          } catch (err) {
            setStatus("error", "Couldn't create room doc");
            log(`Error creating room doc: ${err.code || ""} ${err.message}`);
          }
          return; // the setDoc above will trigger another snapshot with real data
        }
        connected = true;
        const data = snap.data();
        counterEl.textContent = data.counter;
        setStatus("connected", "Connected — live");
        btn.disabled = false;
        log(`Counter is now ${data.counter}`);
      }, err => {
        setStatus("error", "Connection error");
        log(`Error: ${err.code || ""} ${err.message}`);
      });

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await setDoc(roomRef, { counter: increment(1), lastUpdated: serverTimestamp() }, { merge: true });
        } catch (err) {
          log(`Error incrementing: ${err.code || ""} ${err.message}`);
        }
        btn.disabled = false;
      });

      // If nothing has happened after 7 seconds, the request is
      // hanging rather than failing cleanly — that almost always
      // means one of the causes below, not a code problem.
      setTimeout(() => {
        if (!connected) {
          log("Still not connected after 7s. Most likely causes: (1) the Firestore DATABASE itself wasn't created yet in the console — Databases & Storage → Firestore Database → Create database (this is a different product from \"Realtime Database\", easy to mix up); (2) an ad blocker / privacy extension is blocking firestore.googleapis.com — try an incognito/private window with extensions off; (3) a restrictive network (school/work wifi) is blocking Google API traffic — try switching to cellular data.");
        }
      }, 7000);

    } catch (err) {
      setStatus("error", "Setup failed");
      log(`Error: ${err.code || ""} ${err.message}`);
    }
  }
</script>
</body>
</html>
