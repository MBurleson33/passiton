<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pass It On — Firebase Sync Test</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a0d16;
    color: #f3f5fb;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 20px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #9aa3ba; font-size: 0.9rem; }
  #status {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    margin: 12px 0;
  }
  #status.connecting { background: rgba(246,168,33,0.15); color: #ffc266; }
  #status.connected { background: rgba(41,214,200,0.15); color: #6ef0e4; }
  #status.error { background: rgba(228,72,122,0.15); color: #ff9db6; }
  #counter {
    font-size: 5rem;
    font-weight: 800;
    margin: 24px 0;
  }
  button {
    font-size: 1.1rem;
    font-weight: 700;
    padding: 14px 32px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #ffc266, #ff9d3d);
    color: #201404;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #log {
    margin-top: 30px;
    text-align: left;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.8rem;
    color: #9aa3ba;
    max-height: 160px;
    overflow-y: auto;
  }
  #log div { padding: 2px 0; }
</style>
</head>
<body>

<h1>Firebase Sync Test</h1>
<p class="sub">
  Open this same page on two devices (or two browser tabs). Tap the
  button on either one — the count should update on <em>both</em>
  within a second or two. That's the whole test: if it works here,
  the realtime plumbing works for the real game too.
</p>

<div id="status" class="connecting">Connecting…</div>
<div id="counter">–</div>
<button id="bump-btn" disabled>Tap to increment</button>

<div id="log"></div>

<script src="js/firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot, getDoc, increment, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const statusEl = document.getElementById("status");
  const counterEl = document.getElementById("counter");
  const btn = document.getElementById("bump-btn");
  const logEl = document.getElementById("log");

  function log(msg) {
    const line = document.createElement("div");
    line.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
    logEl.prepend(line);
  }

  function setStatus(state, text) {
    statusEl.className = state;
    statusEl.textContent = text;
  }

  // Every device that opens this page joins the same fixed "room" —
  // good enough for a first connectivity test. Real game rooms will
  // use a generated room code instead of this fixed ID.
  const ROOM_ID = "sync-test-room";

  if (!window.firebaseConfig || window.firebaseConfig.apiKey.startsWith("PASTE-")) {
    setStatus("error", "Missing config");
    log("js/firebase-config.js still has placeholder values — paste your real Firebase config in there first.");
  } else {
    try {
      const app = initializeApp(window.firebaseConfig);
      const db = getFirestore(app);
      const roomRef = doc(db, "games", ROOM_ID);

      // Make sure the room document exists before we start listening.
      const existing = await getDoc(roomRef);
      if (!existing.exists()) {
        await setDoc(roomRef, { counter: 0, lastUpdated: serverTimestamp() });
        log("Created the test room document (first device to connect).");
      }

      // Live listener — this fires immediately with the current value,
      // and again every time ANY device changes the document.
      onSnapshot(roomRef, snap => {
        const data = snap.data();
        if (!data) return;
        counterEl.textContent = data.counter;
        setStatus("connected", "Connected — live");
        btn.disabled = false;
        log(`Counter is now ${data.counter}`);
      }, err => {
        setStatus("error", "Connection error");
        log(`Error: ${err.message}`);
      });

      btn.addEventListener("click", async () => {
        btn.disabled = true;
        await setDoc(roomRef, { counter: increment(1), lastUpdated: serverTimestamp() }, { merge: true });
        btn.disabled = false;
      });

    } catch (err) {
      setStatus("error", "Setup failed");
      log(`Error: ${err.message}`);
    }
  }
</script>
</body>
</html>
