<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pass It On — Game State Sync Test</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0a0d16;
    color: #f3f5fb;
    max-width: 520px;
    margin: 30px auto;
    padding: 0 20px 60px;
  }
  h1 { font-size: 1.3rem; text-align: center; }
  p.sub { color: #9aa3ba; font-size: 0.85rem; text-align: center; }

  /* ---- Lobby ---- */
  #lobby { text-align: center; margin-top: 20px; }
  #lobby .btn-primary, #lobby .btn-secondary {
    display: block; width: 100%; font-size: 1.05rem; font-weight: 700;
    padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin: 10px 0;
  }
  #lobby .btn-primary { background: linear-gradient(135deg, #ffc266, #ff9d3d); color: #201404; }
  #lobby .btn-secondary { background: rgba(255,255,255,0.08); color: #f3f5fb; border: 1px solid rgba(255,255,255,0.2); }
  #lobby .or { color: #9aa3ba; font-size: 0.85rem; margin: 18px 0 6px; }
  #join-row { display: flex; gap: 8px; }
  #join-code-input {
    flex: 1; font-size: 1.2rem; font-weight: 700; text-align: center; text-transform: uppercase;
    letter-spacing: 0.15em; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #f3f5fb;
  }
  #room-code-banner {
    text-align: center; background: rgba(255,194,102,0.12); border: 1px solid rgba(255,194,102,0.35);
    border-radius: 12px; padding: 10px; margin-bottom: 14px; font-size: 0.9rem;
  }
  #room-code-banner b { font-size: 1.3rem; letter-spacing: 0.15em; color: #ffc266; }

  /* ---- Game ---- */
  #status {
    display: block; text-align: center;
    padding: 6px 14px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
    margin: 12px auto; width: fit-content;
  }
  #status.connecting { background: rgba(246,168,33,0.15); color: #ffc266; }
  #status.connected { background: rgba(41,214,200,0.15); color: #6ef0e4; }
  #status.error { background: rgba(228,72,122,0.15); color: #ff9db6; }
  #game-info {
    background: rgba(255,255,255,0.05); border-radius: 14px; padding: 16px 18px;
    margin: 16px 0; line-height: 1.7; font-size: 0.92rem;
  }
  #game-info b { color: #ffc266; }
  #hand-area { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0; }
  .card-btn {
    font-family: inherit; font-size: 0.85rem; font-weight: 600;
    padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.06); color: #f3f5fb; cursor: pointer;
  }
  .card-btn.legal { border-color: #ffc266; background: rgba(255,194,102,0.15); }
  .card-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #draw-btn {
    display: block; margin: 16px auto; font-size: 1rem; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #ffc266, #ff9d3d); color: #201404; cursor: pointer;
  }
  #draw-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #log {
    margin-top: 24px; text-align: left; background: rgba(255,255,255,0.05);
    border-radius: 12px; padding: 12px 16px; font-size: 0.78rem; color: #9aa3ba;
    max-height: 160px; overflow-y: auto;
  }
  #log div { padding: 2px 0; }
</style>
</head>
<body>

<h1>Game State Sync Test</h1>
<p class="sub">
  Real game engine, real card data, synced live through Firestore.
  <b>Number cards only for now</b> — Action/Miracle cards aren't wired
  into this test page yet. Still a 2-player test.
</p>

<div id="lobby">
  <button id="host-btn" class="btn-primary">Host a new game</button>
  <p class="or">— or —</p>
  <div id="join-row">
    <input id="join-code-input" placeholder="CODE" maxlength="4" />
    <button id="join-btn" class="btn-secondary" style="width:auto;">Join</button>
  </div>
</div>

<div id="game" style="display:none">
  <div id="room-code-banner"></div>
  <div id="status" class="connecting">Connecting…</div>
  <div id="game-info">Waiting for game state…</div>
  <div id="hand-area"></div>
  <button id="draw-btn" disabled>Draw a card</button>
</div>

<div id="log"></div>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/firebase-config.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
  import {
    getFirestore, doc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

  const lobbyEl = document.getElementById("lobby");
  const gameEl = document.getElementById("game");
  const roomBanner = document.getElementById("room-code-banner");
  const statusEl = document.getElementById("status");
  const infoEl = document.getElementById("game-info");
  const handEl = document.getElementById("hand-area");
  const drawBtn = document.getElementById("draw-btn");
  const logEl = document.getElementById("log");

  function log(msg) {
    const line = document.createElement("div");
    line.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
    logEl.prepend(line);
  }
  function setStatus(state, text) {
    statusEl.className = state;
    statusEl.textContent = text;
  }

  // Short, easy-to-read/say-aloud codes — excludes 0/O/1/I/L, which
  // get confused with each other when read out or typed on mobile.
  function generateRoomCode() {
    const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    let code = "";
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  if (!window.firebaseConfig || window.firebaseConfig.apiKey.startsWith("PASTE-")) {
    lobbyEl.innerHTML = `<p style="color:#ff9db6">js/firebase-config.js still has placeholder values — paste your real Firebase config in there first.</p>`;
  } else {
    const app = initializeApp(window.firebaseConfig);
    const db = getFirestore(app);

    // ---- Lobby wiring ----
    document.getElementById("host-btn").addEventListener("click", () => {
      const code = generateRoomCode();
      setUrl(code, 1);
      startGame(code, 1, /* isHost */ true);
    });
    document.getElementById("join-btn").addEventListener("click", () => {
      const code = document.getElementById("join-code-input").value.trim().toUpperCase();
      if (!code) return;
      setUrl(code, 2);
      startGame(code, 2, /* isHost */ false);
    });

    function setUrl(roomId, seat) {
      const url = new URL(location.href);
      url.searchParams.set("room", roomId);
      url.searchParams.set("seat", seat);
      history.replaceState(null, "", url);
    }

    // Reloading a page you already joined (or a direct link with
    // ?room=&seat= already in it) skips straight past the lobby.
    const params = new URLSearchParams(location.search);
    const existingRoom = params.get("room");
    if (existingRoom) {
      startGame(existingRoom, parseInt(params.get("seat") || "1", 10), false);
    }

    function startGame(roomId, seat, isHost) {
      lobbyEl.style.display = "none";
      gameEl.style.display = "block";
      document.title = `Pass It On — Room ${roomId} — Seat ${seat}`;
      roomBanner.innerHTML = `Room code: <b>${roomId}</b>${isHost ? " — share this with the other player" : ""}`;

      const MY_PLAYER_INDEX = seat - 1;
      const roomRef = doc(db, "games", roomId);
      let currentState = null;
      // Prevents firing a second local move before the first one's
      // Firestore round-trip confirms.
      let actionPending = false;
      function lockControls() {
        actionPending = true;
        drawBtn.disabled = true;
        handEl.querySelectorAll("button").forEach(b => { b.disabled = true; });
      }

      async function pushState(state) {
        try {
          await setDoc(roomRef, state);
        } catch (err) {
          log(`Error saving state: ${err.code || ""} ${err.message}`);
        }
      }

      log(`Connecting to room ${roomId} as Seat ${seat}…`);
      onSnapshot(roomRef, snap => {
        if (snap.metadata.hasPendingWrites) return;
        if (!snap.exists()) {
          if (seat === 1) {
            log("No game found — creating a new 2-player game as host (Seat 1)…");
            const fresh = createGameState(["Player 1", "Player 2"]);
            pushState(fresh);
          } else {
            setStatus("connecting", "Waiting for the host to start the game…");
          }
          return;
        }
        currentState = snap.data();
        setStatus("connected", "Connected — live");
        log("Received game state update.");
        render(currentState);
      }, err => {
        setStatus("error", "Connection error");
        log(`Error: ${err.code || ""} ${err.message}`);
      });

      function render(state) {
        actionPending = false;

        if (state.status === "finished") {
          const winner = state.players[state.players.findIndex(p => p.id === state.winnerId)];
          infoEl.innerHTML = `<b>${winner.name} wins!</b> (Turn ${state.turnCount})`;
          handEl.innerHTML = "";
          drawBtn.disabled = true;
          return;
        }

        const me = state.players[MY_PLAYER_INDEX];
        if (!me) {
          infoEl.textContent = `Seat ${seat} doesn't exist in this 2-player game.`;
          return;
        }
        const current = state.players[state.currentPlayerIndex];
        const isMyTurn = current.id === me.id;

        infoEl.innerHTML = `
          Turn <b>${state.turnCount}</b> — <b>${current.name}</b>'s turn${isMyTurn ? " (you)" : ""}<br>
          Active: <b>${state.activeSuit || "—"}</b> ${state.activeNumber ?? ""}<br>
          Draw pile: ${state.drawPile.length} · Your hand: ${me.hand.length} · Their hand: ${state.players[1 - MY_PLAYER_INDEX].hand.length}<br>
          Blessings: ${me.blessings}
        `;

        handEl.innerHTML = "";
        me.hand.forEach(card => {
          const def = cardDef(card);
          const legal = isMyTurn && canPlayCard(card, state, me.id) && def.type === "number";
          const btn = document.createElement("button");
          btn.className = "card-btn" + (legal ? " legal" : "");
          btn.textContent = def.type === "number" ? def.name : `${def.name} (${def.type})`;
          btn.disabled = !legal;
          btn.addEventListener("click", () => {
            if (actionPending) return;
            lockControls();
            const result = playNumberCard(state, me.id, card.uid);
            if (!result.won) advanceTurn(state);
            log(`You played ${def.name}.`);
            pushState(state);
          });
          handEl.appendChild(btn);
        });

        const anyLegal = me.hand.some(c => isMyTurn && canPlayCard(c, state, me.id) && cardDef(c).type === "number");
        drawBtn.disabled = !isMyTurn || anyLegal;
      }

      drawBtn.addEventListener("click", () => {
        if (!currentState || actionPending) return;
        lockControls();
        const me = currentState.players[MY_PLAYER_INDEX];
        drawCard(currentState, me.id, 1);
        advanceTurn(currentState);
        log("You drew a card.");
        pushState(currentState);
      });
    }
  }
</script>
</body>
</html>
