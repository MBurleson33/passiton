<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pass It On</title>
<meta name="theme-color" content="#0f2a4a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- HOME SCREEN -->
<section id="home-screen" class="screen active">
  <div class="home-wrap">
    <img src="cards/Pass It On - Back.jpg" alt="" class="home-badge-img" />
    <h1 class="brand-title">Pass It On</h1>
    <p class="brand-sub">A Bible-story card game</p>
    <button class="btn btn-gold btn-lg" id="new-game-btn">New Game</button>
    <button class="btn btn-lg" id="play-online-btn">Play Online</button>
    <button class="btn btn-lg" id="resume-game-btn" style="display:none">Resume Game</button>
    <button class="btn btn-lg" id="rejoin-online-btn" style="display:none">Rejoin Online Game</button>
  </div>
</section>

<!-- SETUP SCREEN -->
<section id="setup-screen" class="screen">
  <div class="setup-wrap">
    <h2>Game Setup</h2>
    <label class="field-label">Number of players</label>
    <div class="player-count-row" id="player-count-row">
      <button type="button" class="count-btn" data-count="2">2</button>
      <button type="button" class="count-btn" data-count="3">3</button>
      <button type="button" class="count-btn active" data-count="4">4</button>
      <button type="button" class="count-btn" data-count="5">5</button>
      <button type="button" class="count-btn" data-count="6">6</button>
    </div>
    <div id="player-name-list"></div>
    <button class="btn btn-gold btn-lg" id="start-game-btn">Deal the Cards</button>
  </div>
</section>

<!-- MAIN GAME SCREEN -->
<section id="game-screen" class="screen">
  <header class="game-header">
    <div class="header-left">
      <button class="icon-btn" id="quit-to-home-btn" title="Quit to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg>
      </button>
      <span class="turn-badge">Turn <span id="turn-count">1</span></span>
      <span class="turn-badge room-badge" id="room-code-tag" title="Room code" style="display:none"></span>
    </div>
    <div class="header-center">
      <span class="current-player-tag"><svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="17" rx="2.5" transform="rotate(-8 9.5 15.5)"/><rect x="8" y="3" width="13" height="17" rx="2.5"/></svg> <span id="current-player-name"></span></span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="toggle-log-btn" title="Game log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
      </button>
    </div>
  </header>

  <div id="action-lock-badge" class="lock-badge"></div>
  <div id="free-play-badge" class="lock-badge free-play-badge"></div>

  <div class="table-wrap">
    <div class="table-circle">
      <div class="table-ring"></div>
      <div id="opponent-seats" class="opponent-seats"></div>
      <div class="table-center">
        <div id="discard-pile" class="discard-pile-visual"></div>
        <div class="active-badges">
          <span id="active-suit-badge" class="badge">—</span>
          <span id="active-number-badge" class="badge badge-number">—</span>
          <span id="active-symbol-badge" class="badge badge-symbol" style="display:none"></span>
        </div>
      </div>
      <div class="draw-pile-group" id="draw-btn" title="Draw a card">
        <div class="draw-pile-visual">
          <img src="cards/Pass It On - Back.jpg" alt="Draw pile" />
        </div>
        <div class="pile-label">Draw · <span id="draw-pile-count">0</span></div>
      </div>
    </div>
  </div>

  <p class="hint-text" id="hint-text"></p>
  <div class="turn-actions">
    <button class="btn btn-gold" id="end-turn-btn" style="display:none">End Turn</button>
  </div>

  <footer class="hand-footer">
    <div class="hand-header">
      <span id="hand-label">Your hand</span>
      <button class="grace-btn" id="grace-market-btn" type="button"><svg class="mini-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v7h14v-7M12 8v12M12 8S10.5 3 8 3.8 8.5 8 12 8zM12 8s1.5-5 4-4.2S15.5 8 12 8z"/></svg> Grace Market</button>
      <span class="my-blessings"><svg class="sparkle-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg> <span id="my-blessings">0</span> Blessings</span>
    </div>
    <div class="my-gifts" id="my-gifts"></div>
    <div class="hand-scroll" id="player-hand"></div>
  </footer>

  <div id="game-log" class="game-log"></div>
</section>

<!-- RESULTS SCREEN -->
<section id="results-screen" class="screen">
  <div class="results-wrap">
    <h2><svg class="trophy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v6a4 4 0 0 1-8 0z"/><path d="M8 5H4v2a4 4 0 0 0 4 3.5"/><path d="M16 5h4v2a4 4 0 0 1-4 3.5"/><path d="M10 14v3M14 14v3M8 21h8M9 21v-2.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V21"/></svg> We have a winner!</h2>
    <div class="pass-name" id="winner-name">—</div>
    <div class="results-stats">
      <div><span id="result-turns">0</span><label>Turns played</label></div>
      <div><span id="result-blessings">0</span><label>Blessings collected</label></div>
      <div><span id="result-miracles">0</span><label>Miracles played</label></div>
    </div>
    <button class="btn btn-gold btn-lg" id="play-again-btn">Play Again</button>
    <button class="btn btn-lg" id="home-btn-results">Home</button>
  </div>
</section>

<!-- DESKTOP HOVER TOOLTIP (Action/Miracle card effects) -->
<!-- ROTATE PROMPT (phones held sideways — see css) -->
<div class="rotate-overlay" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <p>Please turn your phone upright</p>
  <small>Pass It On is played in portrait.</small>
</div>

<div id="card-tooltip" class="card-tooltip"></div>

<!-- CARD ZOOM OVERLAY (hold-to-view) -->
<div id="zoom-overlay" class="zoom-overlay">
  <div class="zoom-box" id="zoom-box"></div>
</div>

<!-- MODAL OVERLAY (effect resolution) -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box" id="modal-body"></div>
</div>

<!-- ONLINE LOBBY SCREEN -->
<section id="online-lobby-screen" class="screen">
  <div class="setup-wrap">
    <h2>Play Online</h2>
    <div id="online-join-panel">
      <label class="field-label" for="online-name">Your name</label>
      <input type="text" id="online-name" maxlength="16" placeholder="Your name" class="name-field" autocomplete="nickname" />
      <button class="btn btn-gold btn-lg" id="online-host-btn">Host a New Game</button>
      <div id="online-count-picker" style="display:none;">
        <label class="field-label">Number of players</label>
        <div class="player-count-row" id="online-count-row">
          <button type="button" class="count-btn" data-count="2">2</button>
          <button type="button" class="count-btn" data-count="3">3</button>
          <button type="button" class="count-btn" data-count="4">4</button>
          <button type="button" class="count-btn" data-count="5">5</button>
          <button type="button" class="count-btn" data-count="6">6</button>
        </div>
      </div>
      <p class="or-divider">— or —</p>
      <label class="field-label" for="online-join-code">Join with a code</label>
      <div class="player-name-row">
        <input type="text" id="online-join-code" maxlength="4" placeholder="CODE" class="join-code-field" autocapitalize="characters" autocomplete="off" />
        <button class="btn" id="online-join-btn" style="width:auto;">Join</button>
      </div>
    </div>
    <div id="online-waiting" style="display:none;">
      <p class="waiting-label">Room code</p>
      <div class="waiting-code" id="online-waiting-code">----</div>
      <button class="btn" id="online-copy-code">Share invite</button>
      <ol class="seat-list" id="online-seat-list"></ol>
    </div>
    <div id="online-lobby-status" class="online-lobby-status"></div>
    <button class="btn" id="online-back-btn" style="margin-top:24px;">Back to Home</button>
  </div>
</section>

<script src="js/firebase-config.js"></script>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/online.js"></script>
</body>
</html>
